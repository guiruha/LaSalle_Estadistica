[project]
name = "lasalle-estadistica"
version = "0.1.0"
description = "Entorno de Python para los cuadernos de Estadística de MUBD"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<8",
    "ipython>=8.29,<10",
    "ipywidgets>=8.1,<9",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13,<0.14",
    "statsmodels>=0.14,<0.16",
    "threadpoolctl>=3.5,<4",
]

[tool.uv]
package = false